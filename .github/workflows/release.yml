name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Cairn ${tag}`,
              body: [
                "Unsigned builds.",
                "",
                "- **macOS (Apple Silicon):** open the `.dmg`, drag Cairn to Applications, then run `xattr -dr com.apple.quarantine /Applications/Cairn.app` (or right-click → Open).",
                "- **Ubuntu 24.04+:** `sudo apt install ./Cairn_*.deb`. For serial consoles, join the `dialout` group: `sudo usermod -aG dialout $USER`, then log out and back in.",
              ].join("\n"),
              draft: true,
              prerelease: tag.includes("-"),
            });
            core.setOutput("id", data.id);

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-deb
            os: ubuntu-24.04
            args: --bundles deb
          - name: macos-dmg
            os: macos-14
            args: --target aarch64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
