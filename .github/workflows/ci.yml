name: CI

on:
  # Every branch push runs CI (a PR from this repo shows these checks too).
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri::generate_context! embeds the built frontend, so it must exist first.
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain (cargo deny, cargo audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  bundle-linux:
    name: Bundle .deb (ubuntu-24.04)
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: scripts/install-linux-deps.sh
      - run: sudo apt-get install -y --no-install-recommends xvfb imagemagick x11-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --bundles deb
      - name: Screenshot the app under Xvfb
        run: scripts/screenshot.sh target/release/cairn screenshots/shell.png
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/*.png
          if-no-files-found: error

  bundle-macos:
    name: Bundle .dmg (macos-14, aarch64)
    needs: [frontend, rust]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-macos-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
