name: CI

on:
  # Pull requests get one run; main gets one run per merge. Pushes to other branches
  # do not run on their own (open a PR), so a change costs two runs, not four.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR or branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Debug info makes the workspace's test binaries outgrow the runner's free disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Free disk space (unused preinstalled SDKs)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri::generate_context! embeds the built frontend, so it must exist first.
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Start test servers (OpenSSH modern + legacy; socat/lrzsz for serial; telnetd; xrdp)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client socat lrzsz inetutils-telnetd xrdp xorgxrdp xterm dbus-x11
          sudo scripts/test-sshd.sh /tmp/cairn-sshd
          sudo scripts/test-telnetd.sh 2323
          sudo scripts/test-xrdp.sh /tmp/cairn-xrdp
          echo "CAIRN_TELNET_PORT=2323" >> "$GITHUB_ENV"
          sed 's/^export //' /tmp/cairn-sshd/env >> "$GITHUB_ENV"
          sed 's/^export //' /tmp/cairn-xrdp/env >> "$GITHUB_ENV"
          echo "CAIRN_SSH_TESTS=1" >> "$GITHUB_ENV"
          echo "CAIRN_RDP_TESTS=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain (cargo deny, cargo audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
      - run: cargo audit

  bundle-linux:
    name: Bundle .deb (ubuntu-24.04)
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: scripts/install-linux-deps.sh
      - run: sudo apt-get install -y --no-install-recommends xvfb imagemagick x11-utils xdotool webkit2gtk-driver
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The release workflow builds the same release profile and shares this cache.
          shared-key: bundle-${{ runner.os }}
      - name: Cache tauri-driver
        id: tauri-driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}
      - if: steps.tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --bundles deb -- --locked
      - name: UI smoke test with screenshots (Xvfb)
        run: scripts/ui-smoke.sh target/release/cairn screenshots
      - name: WebDriver e2e smoke test (tauri-driver, Xvfb)
        run: xvfb-run -a -s "-screen 0 1400x900x24" node e2e/smoke.mjs target/release/cairn screenshots/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots-linux
          path: screenshots/
          if-no-files-found: error

  bundle-macos:
    name: Bundle .dmg (macos-14, aarch64)
    needs: [frontend, rust]
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bundle-${{ runner.os }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cairn-macos-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
