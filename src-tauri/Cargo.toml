[package]
name = "cairn"
description = "Cairn — SSH, serial, Telnet and RDP client with a network infrastructure map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "cairn"

[lib]
name = "cairn_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cairn-core.workspace = true
cairn-proto-serial.workspace = true
cairn-proto-ssh.workspace = true
cairn-proto-telnet.workspace = true
cairn-pty.workspace = true
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
